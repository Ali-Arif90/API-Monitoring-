services:
  - type: web
    name: api-monitoring-backend
    env: node
    plan: free
    region: singapore
    branch: main
    root: server
    buildCommand: npm install
    startCommand: npm start
    # Set required env vars in the Render dashboard after creating the service.
    # Recommended env var names:
    # - MONGO_URI
    # - MONGO_DB_NAME
    # - PG_HOST
    # - PG_PORT
    # - PG_DATABASE
    # - PG_USER
    # - PG_PASSWORD
    # - RABBITMQ_URL
    # - RABBITMQ_QUEUE
    # - JWT_SECRET
    # - NODE_ENV
    # - PORT
